<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>

    <!-- Glowing Cyber Grid -->
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.05" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05" />
    </linearGradient>

    <!-- Shield Glow Gradient -->
    <radialGradient id="shieldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0b1329" stop-opacity="0" />
    </radialGradient>

    <!-- Flow Line Gradient -->
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <!-- Text Highlight Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Subtitle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.04); }
      }
      @keyframes packetMove1 {
        0% { transform: translateX(-200px); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translateX(1300px); opacity: 0; }
      }
      @keyframes packetMove2 {
        0% { transform: translateX(-150px); opacity: 0; }
        25% { opacity: 0.8; }
        75% { opacity: 0.8; }
        100% { transform: translateX(1350px); opacity: 0; }
      }
      @keyframes packetMove3 {
        0% { transform: translateX(1300px); opacity: 0; }
        20% { opacity: 0.9; }
        80% { opacity: 0.9; }
        100% { transform: translateX(-200px); opacity: 0; }
      }
      @keyframes floatShield {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes statusBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }

      .bg-pulse {
        animation: pulseGlow 6s ease-in-out infinite;
        transform-origin: 600px 180px;
      }
      .packet-flow-1 {
        animation: packetMove1 7s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .packet-flow-2 {
        animation: packetMove2 9s cubic-bezier(0.4, 0, 0.2, 1) infinite 1.5s;
      }
      .packet-flow-3 {
        animation: packetMove3 8s cubic-bezier(0.4, 0, 0.2, 1) infinite 3s;
      }
      .shield-anim {
        animation: floatShield 5s ease-in-out infinite;
      }
      .status-dot {
        animation: statusBlink 2s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />

  <!-- Dynamic Cyber Grid (Background layer) -->
  <g stroke="url(#gridGrad)" stroke-width="1" opacity="0.65">
    <!-- Horizontal Grid Lines -->
    <line x1="0" y1="40" x2="1200" y2="40" />
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="190" x2="1200" y2="190" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="290" x2="1200" y2="290" />
    <line x1="0" y1="340" x2="1200" y2="340" />
    <!-- Vertical Grid Lines -->
    <line x1="80" y1="0" x2="80" y2="360" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="320" y1="0" x2="320" y2="360" />
    <line x1="440" y1="0" x2="440" y2="360" />
    <line x1="560" y1="0" x2="560" y2="360" />
    <line x1="680" y1="0" x2="680" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="920" y1="0" x2="920" y2="360" />
    <line x1="1040" y1="0" x2="1040" y2="360" />
    <line x1="1140" y1="0" x2="1140" y2="360" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="180" r="180" fill="url(#shieldGlow)" class="bg-pulse" />
  <circle cx="1020" cy="180" r="220" fill="url(#shieldGlow)" class="bg-pulse" />

  <!-- Animated Packet Data Streams (Behind text) -->
  <g opacity="0.75">
    <!-- Stream 1 -->
    <line x1="0" y1="65" x2="1200" y2="65" stroke="#1e293b" stroke-width="2" stroke-dasharray="4,6" />
    <g class="packet-flow-1">
      <rect x="0" y="63" width="80" height="4" rx="2" fill="url(#beamGrad)" />
      <circle cx="80" cy="65" r="3" fill="#38bdf8" />
    </g>

    <!-- Stream 2 -->
    <line x1="0" y1="305" x2="1200" y2="305" stroke="#1e293b" stroke-width="2" stroke-dasharray="6,8" />
    <g class="packet-flow-2">
      <rect x="0" y="303" width="100" height="4" rx="2" fill="url(#beamGrad)" />
      <circle cx="100" cy="305" r="3.5" fill="#818cf8" />
    </g>

    <!-- Stream 3 (Reverse Flow) -->
    <line x1="0" y1="325" x2="1200" y2="325" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="3,7" />
    <g class="packet-flow-3">
      <rect x="0" y="323" width="70" height="4" rx="2" fill="url(#beamGrad)" />
      <circle cx="0" cy="325" r="3" fill="#34d399" />
    </g>
  </g>

  <!-- Decorative Firewall Graphic Elements (Left Side Shield) -->
  <g transform="translate(75, 95)" class="shield-anim">
    <!-- Shield Outer Glow & Hexagon -->
    <polygon points="50,0 95,25 95,85 50,110 5,85 5,25" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" opacity="0.9" />
    <polygon points="50,12 83,32 83,78 50,98 17,78 17,32" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5" opacity="0.85" />
    
    <!-- Firewall Brick / Core Icon -->
    <path d="M 33 42 L 67 42 M 28 54 L 72 54 M 33 66 L 67 66" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <line x1="50" y1="42" x2="50" y2="54" stroke="#38bdf8" stroke-width="2.5" />
    <line x1="40" y1="54" x2="40" y2="66" stroke="#38bdf8" stroke-width="2.5" />
    <line x1="60" y1="54" x2="60" y2="66" stroke="#38bdf8" stroke-width="2.5" />

    <!-- Pulse nodes on Shield -->
    <circle cx="50" cy="0" r="4" fill="#38bdf8" />
    <circle cx="95" cy="85" r="3.5" fill="#818cf8" />
    <circle cx="5" cy="85" r="3.5" fill="#818cf8" />
  </g>

  <!-- FOREGROUND LAYER: Title, Subtitle, Badges (Guaranteed on top, crisp and unobstructed) -->
  <g transform="translate(210, 0)">
    
    <!-- Category Mini-Pill Badge -->
    <g transform="translate(0, 52)">
      <rect x="0" y="0" width="240" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
      <circle cx="15" cy="14" r="5" fill="#10b981" class="status-dot" />
      <text x="28" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1">NETWORK DEFENSE STACK</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="130" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="900" letter-spacing="-0.5" filter="url(#glow)">Awesome Firewall &amp; Network Security</text>

    <!-- Subtitle -->
    <text x="0" y="172" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400">
      Curated directory of Enterprise Next-Gen Firewalls (NGFW), Open-Source Defense &amp; Zero Trust Networks
    </text>

    <!-- Highlighting Pill Badges -->
    <g transform="translate(0, 215)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="145" height="34" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1.2" />
        <text x="72" y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🛡️ Enterprise NGFW</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(155, 0)">
        <rect width="145" height="34" rx="8" fill="#0f172a" stroke="#4f46e5" stroke-width="1.2" />
        <text x="72" y="22" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">⚡ Open-Source</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(310, 0)">
        <rect width="145" height="34" rx="8" fill="#0f172a" stroke="#059669" stroke-width="1.2" />
        <text x="72" y="22" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🔒 Zero Trust &amp; eBPF</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(465, 0)">
        <rect width="145" height="34" rx="8" fill="#0f172a" stroke="#7c3aed" stroke-width="1.2" />
        <text x="72" y="22" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">📡 IDS / IPS &amp; NSM</text>
      </g>
      <!-- Pill 5 -->
      <g transform="translate(620, 0)">
        <rect width="145" height="34" rx="8" fill="#0f172a" stroke="#d97706" stroke-width="1.2" />
        <text x="72" y="22" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🌐 Threat Feeds</text>
      </g>
    </g>

    <!-- Metrics Line -->
    <g transform="translate(0, 275)">
      <circle cx="6" cy="6" r="4" fill="#38bdf8" />
      <text x="18" y="10" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
        Transparent Pricing • Free Tier &amp; Evaluation Limits • Market Share Dynamics • Star Rankings
      </text>
    </g>
  </g>

  <!-- Frame Border -->
  <rect x="0.5" y="0.5" width="1199" height="359" rx="8" fill="none" stroke="#1e293b" stroke-width="1" />
</svg>